[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smartdialer"
version = "0.1.0"
description = "Single-process predictive call-center dialer with FSM-gated concurrency control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
log_cli = true
log_cli_level = "INFO"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
